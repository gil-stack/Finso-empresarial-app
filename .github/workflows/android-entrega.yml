# Entrega de la app Android a «Prueba interna» de Google Play.
#
# - A mano (Actions › «Android · entrega a Google Play» › Run workflow): arma
#   el AAB de la tienda (API real), lo firma con la llave de subida y lo sube
#   a la pista interna. Solo a mano, nunca solo.
# - En un PR que toca esta entrega o la compilación de release: solo arma el
#   AAB (firmado con la llave de depuración) para comprobar que compila con
#   R8. No sube nada ni usa secretos.
#
# Acciones de terceros fijadas por SHA del commit (no por etiqueta).
#
# Secretos del repo (Settings › Secrets and variables › Actions). Nunca se
# imprimen ni se guardan en archivos del repo:
#   ANDROID_KEYSTORE_B64       la llave de subida (.jks) en base64
#   ANDROID_KEYSTORE_PASSWORD  contraseña del .jks
#   ANDROID_KEY_ALIAS          alias de la llave
#   ANDROID_KEY_PASSWORD       contraseña de la llave
#   PLAY_SERVICE_ACCOUNT_JSON  JSON de la cuenta de servicio con acceso a Play Console
#   FIREBASE_APP_ID, FIREBASE_API_KEY, FIREBASE_PROYECTO, FIREBASE_REMITENTE
#                              (opcionales) avisos con la app cerrada
name: Android · entrega a Google Play

on:
  workflow_dispatch:
    inputs:
      estado:
        description: "completed = disponible para los probadores; draft = queda en borrador (obligatorio mientras la app no tenga su primera versión revisada)"
        type: choice
        options: [completed, draft]
        default: completed
  pull_request:
    paths:
      - ".github/workflows/android-entrega.yml"
      - "android/app/build.gradle.kts"
      - "android/app/proguard-rules.pro"
      - "android/gradle/libs.versions.toml"

concurrency:
  group: android-entrega-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  entrega:
    name: AAB de la tienda
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          cache-read-only: true

      - name: Revisar secretos
        if: github.event_name == 'workflow_dispatch'
        env:
          K: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KP: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KA: ${{ secrets.ANDROID_KEY_ALIAS }}
          KK: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PS: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          falta=""
          [ -n "$K" ]  || falta="$falta ANDROID_KEYSTORE_B64"
          [ -n "$KP" ] || falta="$falta ANDROID_KEYSTORE_PASSWORD"
          [ -n "$KA" ] || falta="$falta ANDROID_KEY_ALIAS"
          [ -n "$KK" ] || falta="$falta ANDROID_KEY_PASSWORD"
          [ -n "$PS" ] || falta="$falta PLAY_SERVICE_ACCOUNT_JSON"
          if [ -n "$falta" ]; then
            echo "::error::Faltan secretos del repo:$falta"
            exit 1
          fi

      - name: Llave de subida (solo en la máquina de esta corrida)
        if: github.event_name == 'workflow_dispatch'
        env:
          K: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          echo "$K" | base64 -d > "$RUNNER_TEMP/subida.jks"
          echo "FINSO_KEYSTORE_RUTA=$RUNNER_TEMP/subida.jks" >> "$GITHUB_ENV"

      - name: Armar el AAB
        env:
          FINSO_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          FINSO_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          FINSO_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          FINSO_FIREBASE_APP_ID: ${{ github.event_name == 'workflow_dispatch' && secrets.FIREBASE_APP_ID || '' }}
          FINSO_FIREBASE_API_KEY: ${{ github.event_name == 'workflow_dispatch' && secrets.FIREBASE_API_KEY || '' }}
          FINSO_FIREBASE_PROYECTO: ${{ github.event_name == 'workflow_dispatch' && secrets.FIREBASE_PROYECTO || '' }}
          FINSO_FIREBASE_REMITENTE: ${{ github.event_name == 'workflow_dispatch' && secrets.FIREBASE_REMITENTE || '' }}
        # El número de versión crece solo: 1000 + número de corrida (por encima
        # de cualquier AAB subido a mano).
        run: >
          ./gradlew --stacktrace :app:bundleRelease
          -Pfinso.build=$((1000 + ${{ github.run_number }}))

      - name: Borrar la llave
        if: always()
        run: rm -f "$RUNNER_TEMP/subida.jks"

      - name: Subir a Prueba interna
        if: github.event_name == 'workflow_dispatch'
        uses: r0adkll/upload-google-play@935ef9c68bb393a8e6116b1575626a7f5be3a7fb # v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ vars.ANDROID_APP_ID || 'mx.finsocial.empresarial' }}
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: ${{ inputs.estado }}
          mappingFile: android/app/build/outputs/mapping/release/mapping.txt

      - name: Guardar el AAB
        uses: actions/upload-artifact@v4
        with:
          name: aab-android
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 14

      - name: Resumen
        if: always()
        run: |
          {
            echo "### Android · entrega"
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo "- AAB firmado con la llave de subida y enviado a **Prueba interna** (${{ inputs.estado }})."
            else
              echo "- Solo se comprobó que el AAB de la tienda compila (sin subir, sin secretos)."
            fi
            echo "- Versión: $((1000 + ${{ github.run_number }}))."
          } >> "$GITHUB_STEP_SUMMARY"
